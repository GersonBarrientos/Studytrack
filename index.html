<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyTrack AI - Java Master</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --sur:#13131a; --sur2:#1c1c28; --bor:#2a2a3d;
  --acc:#6c63ff; --acc2:#ff6584; --acc3:#43e97b; --acc4:#f7971e;
  --txt:#e8e8f0; --txt2:#9090a8; --txt3:#5a5a72;
  --ok:#43e97b; --bad:#ff6584; --glow:rgba(108,99,255,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}
.screen{display:none;min-height:100vh;position:relative;z-index:1;}
.screen.active{display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 36px;border-bottom:1px solid var(--bor);background:rgba(10,10,15,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;}
.logo span{color:var(--acc);}
.tag{font-family:'DM Mono',monospace;font-size:.68rem;background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.3);padding:4px 10px;border-radius:2px;text-transform:uppercase;color:var(--acc);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:none;border-radius:4px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:.03em;}
.btn-primary{background:var(--acc);color:#fff;box-shadow:0 0 24px var(--glow);}
.btn-outline{background:transparent;color:var(--txt);border:1px solid var(--bor);}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:22px;}
.dash-body{padding:36px;max-width:1180px;margin:0 auto;width:100%;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px;}
.stat-card{background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:18px;position:relative;}
.stat-v{font-size:1.9rem;font-weight:800;font-family:'DM Mono',monospace;}
.subj-grid{display:grid;grid-template-columns:1fr;gap:12px;}
.subj-card{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:18px;cursor:pointer;transition:0.2s;}
.subj-card:hover{border-color:var(--acc);}
.subj-card.sel{border-color:var(--acc);background:rgba(108,99,255,.1);}
.qz-header{display:flex;align-items:center;justify-content:space-between;padding:14px 36px;border-bottom:1px solid var(--bor);}
.qz-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:36px 20px;max-width:740px;margin:0 auto;width:100%;}
.q-text{font-size:1.3rem;font-weight:700;margin-bottom:28px;}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;}
.opt{padding:14px 18px;border:1px solid var(--bor);border-radius:6px;cursor:pointer;background:var(--sur);display:flex;align-items:center;gap:14px;transition:0.2s;}
.opt.correct{border-color:var(--ok);background:rgba(67,233,123,.1);color:var(--ok);}
.opt.wrong{border-color:var(--bad);background:rgba(255,101,132,.1);color:var(--bad);}
.expl{margin-top:18px;padding:14px;background:rgba(108,99,255,.06);border-left:3px solid var(--acc);font-size:.88rem;color:var(--txt2);line-height:1.5;}
.ring-wrap{width:130px;height:130px;margin:0 auto 16px;position:relative;}
.ring-bg{fill:none;stroke:var(--bor);stroke-width:8;}
.ring-fill{fill:none;stroke-width:8;stroke-dasharray:339;stroke-dashoffset:339;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono';}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeUp .4s ease both;}
</style>
</head>
<body>

<div id="screen-dash" class="screen active">
  <div class="topbar"><div class="logo">Study<span>Track</span> AI</div><span class="tag">Java Full v1.2</span></div>

    </div>
  </div>
</div>

<div id="screen-quiz" class="screen">

  <div class="qz-body">
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
    <div class="expl" id="expl" style="display:none"></div>
    <button class="btn btn-primary" id="btn-next" style="display:none;margin-top:20px;align-self:flex-end">Siguiente →</button>
  </div>
</div>

<div id="screen-res" class="screen">
  <div class="topbar"><div class="logo">Análisis Final</div></div>

      <svg width="130" height="130"><circle class="ring-bg" cx="65" cy="65" r="54"/><circle class="ring-fill" id="ring" cx="65" cy="65" r="54" stroke="var(--acc3)"/></svg>
      <div class="ring-center"><div id="res-pct" style="font-size:1.8rem;font-weight:800">0%</div></div>

    <h3 id="res-msg" style="margin-bottom:20px"></h3>
    <button class="btn btn-primary" onclick="location.reload()">Nuevo Entrenamiento</button>
  </div>
</div>

      {text: '¿Qué son arreglos paralelos?', opts: ['Matriz', 'Multiproceso', 'Mismo contenido', 'Mismo índice relacionado'], ans: 3, exp: 'Registros distribuidos [cite: 184-186].'},
      {text: 'Matriz en resultados elección:', opts: ['Votos regionales', 'Gráficos', 'Raíz', 'Nombres'], ans: 0, exp: 'Organiza datos por candidatos/zonas[cite: 187, 188].'},
      {text: '¿Por qué hay tantos algoritmos de orden?', opts: ['Java tipos', 'Al azar', 'Viejos fallan', 'Desempeño diferente bajo distintas condiciones'], ans: 3, exp: 'Cada uno brilla en casos distintos [cite: 190-194].'},
      {text: 'Factor clave elección método:', opts: ['Estética', 'Líneas', 'Eficiencia en comparaciones y asignaciones', 'Autor'], ans: 2, exp: 'La métrica de rendimiento es vital [cite: 195-197].'},
      {text: 'Binaria: indica que no está el elemento si:', opts: ['primero > último', 'mitad cero', 'Error', '10 iteraciones'], ans: 0, exp: 'Cruces de punteros[cite: 198, 199].'},
      {text: 'Beneficio Vector vs arreglo:', opts: ['Velocidad', 'Memoria', 'Sin tipo', 'Manejo dinámico de listas'], ans: 3, exp: 'Crecimiento elástico automático[cite: 201, 202].'}
    ]
  };

  let S = { current: 0, correct: 0, history: [], mode: 'study', selectedId: 'methods' };

  function shuffle(arr){
    return arr.sort(() => Math.random() - 0.5);
  }

  function renderQ(){
    const q = S.quizSet[S.current];
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('expl').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('qz-info').textContent = `Pregunta ${S.current + 1} de ${S.quizSet.length}`;
    
    let html = '';
    q.opts.forEach((o, i) => {
      html += `<div class="opt" onclick="check(${i})">${o}</div>`;
    });
    document.getElementById('opts').innerHTML = html;
  }

  window.check = function(idx){
    if(document.querySelector('.opt.disabled')) return;
    const q = S.quizSet[S.current];
    const opts = document.querySelectorAll('.opt');
    
    opts.forEach((el, i) => {
      el.classList.add('disabled');
      if(i === q.ans) el.classList.add('correct');
      if(i === idx && idx !== q.ans) el.classList.add('wrong');
    });

    if(idx === q.ans) S.correct++;

    if(S.mode === 'study'){
      document.getElementById('expl').innerHTML = `<strong>Explicación:</strong> ${q.exp}`;
      document.getElementById('expl').style.display = 'block';
    }
    document.getElementById('btn-next').style.display = 'block';
  };

  document.getElementById('btn-mode').onclick = () => {
    S.mode = S.mode === 'study' ? 'exam' : 'study';
    document.getElementById('btn-mode').textContent = `Modo: ${S.mode === 'study' ? 'Estudio' : 'Examen'}`;
  };

  document.getElementById('btn-start').onclick = () => {
    S.quizSet = shuffle([...QB_FULL[S.selectedId]]);
    S.current = 0; S.correct = 0;
    document.getElementById('screen-dash').classList.remove('active');
    document.getElementById('screen-quiz').classList.add('active');
    document.getElementById('qz-subj').textContent = CATEGORIES.find(c => c.id === S.selectedId).name;
    renderQ();
  };

  document.getElementById('btn-next').onclick = () => {
    S.current++;
    if(S.current < S.quizSet.length) renderQ();
    else {
      const pct = Math.round((S.correct / S.quizSet.length) * 100);
      document.getElementById('screen-quiz').classList.remove('active');
      document.getElementById('screen-res').classList.add('active');
      document.getElementById('res-pct').textContent = pct + '%';
      document.getElementById('ring').style.strokeDashoffset = 339 * (1 - pct/100);
      document.getElementById('res-msg').textContent = pct >= 70 ? '¡Dominio Técnico Alcanzado!' : 'Se recomienda repasar la documentación.';
    }
  };

  // Build Subjects
  const grid = document.getElementById('subj-grid');
  CATEGORIES.forEach(c => {
    const div = document.createElement('div');
    div.className = 'subj-card' + (S.selectedId === c.id ? ' sel' : '');
    div.innerHTML = `<h3>${c.icon} ${c.name}</h3><p>25 preguntas técnicas</p>`;
    div.onclick = () => {
      document.querySelectorAll('.subj-card').forEach(x => x.classList.remove('sel'));
      div.classList.add('sel');
      S.selectedId = c.id;
    };
    grid.appendChild(div);
  });

})();
</script>
</body>
</html>
